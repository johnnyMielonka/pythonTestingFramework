[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-framework"
version = "0.1.0"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
src = "src"

[tool.pytest.ini_options]
testpaths = ["features"]

[tool.coverage.run]
source = ["src", "features"]

[tool.coverage.report]
omit = ["features/*", "*/tests/*"]